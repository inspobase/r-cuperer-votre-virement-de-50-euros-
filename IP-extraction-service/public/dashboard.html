<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<style>body{font-family:system-ui;max-width:1000px;margin:50px auto;padding:20px}input,button{padding:9px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style>
</head>
<body>
<h1>Dashboard privé</h1>
<p>Entre le jeton ADMIN_TOKEN configuré sur ton serveur.</p>
<input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="load">Charger</button>
<div id="status"></div>
<table><thead><tr><th>IP</th><th>Date</th><th>Navigateur</th></tr></thead><tbody id="rows"></tbody></table>
<script>
document.querySelector("#load").onclick=async()=>{
 const token=document.querySelector("#token").value;
 const r=await fetch("/api/entries",{headers:{Authorization:`Bearer ${token}`}});
 if(!r.ok){document.querySelector("#status").textContent="Accès refusé.";return}
 const data=await r.json();
 document.querySelector("#status").textContent=`${data.length} entrée(s)`;
 document.querySelector("#rows").innerHTML=data.map(x=>`<tr><td>${esc(x.ip)}</td><td>${esc(x.date)}</td><td>${esc(x.userAgent)}</td></tr>`).join("");
};
function esc(s){const d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
</script>
</body></html>
